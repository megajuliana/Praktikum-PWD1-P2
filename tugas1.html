<!DOCTYPE html>
<html>
<head>
    <title>Absensi Mahasiswa Teknik Informatika</title>
</head>
<body>

    <h1>Absensi Mahasiswa Teknik Informatika</h1>
    <table border="1" cellpadding="4" cellspacing="3">
        <!-- header data  -->
        <tr>
            <th rowspan="3">NO</th>
            <th rowspan="3">NPM</th>
            <th rowspan="3">NAMA</th>
            <th colspan="7">PERTEMUAN</th>
        </tr>

        <!-- jumlah pertemuan -->

            <th>1</th>
            <th>2</th>
            <th>3</th>
            <th>4</th>
            <th>5</th>
            <th>6</th>
            <th>7</th>
        </tr>

        <!-- tanggal pertemuan -->
        <tr>
            <th>9-Feb</th>
            <th>16-Feb</th>
            <th>23-Feb</th>
            <th>2-Mar</th>
            <th>9-Mar</th>
            <th>16-Mar</th>
            <th>23-Mar</th>
        </tr>

        <!-- data1 -->
        <tr>
            <td>1</td>
            <td>1234567890</td>
            <td>Mega Juliana</td>
            <td>v</td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
        </tr>

        <!-- data2 -->
        <tr>
            <td>2</td>
            <td>1987654321</td>
            <td>Putri Zahra</td>
            <td>v</td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
        </tr>

        <!-- data3 -->
        <tr>
            <td>3</td>
            <td>2345678901</td>
            <td>Berlin Lianda</td>
            <td>v</td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
        </tr>
    </table>

</body>
</html>
