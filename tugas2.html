<!DOCTYPE html>
<head>
    <title>Tugas2 Form Mahasiswa</title>
</head>
<body>
     
    <h3>Form Mahasiswa</h3>
    <form  method="post" action="#">
        <div>
            <table>
                <tr>
                    <td>Nama</td> 
                    <td>:</td>
                    <td><input type="text" name="nama"></td>
                </tr>
                <tr>
                    <td>NPM</td>
                    <td>:</td>
                    <td><input type="text" name="npm"></td>
                </tr>
                <tr>
                    <td>Kelas</td>
                    <td>:</td>
                    <td>
                        <select name="kelas">
                            <option value="">Pilih Kelas</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Jenis Kelamin</td>
                    <td>:</td>
                    <td>
                        <input type="radio" name="gender" value="pria"> Pria
                        <input type="radio" name="gender" value="wanita"> Wanita   
                    </td>
                </tr>
            </table>
        </div>

        <!-- <h3>Tempat Tinggal Mahasiswa</h3> -->
        <div>
            <table>
                <tr>
                    <td>Alamat</td>
                    <td>:</td>
                    <td>
                        <textarea name="alamat" rows="4" cols="25"></textarea>
                    </td>
                </tr>
                <tr>
                    <td>Kecamatan</td>
                    <td>:</td>
                    <td><input type="text" name="kecamatan"></td>
                </tr>
                <tr>
                    <td>Kabupaten/Kotamadya</td>
                    <td>:</td>
                    <td><input type="text" name="kabupaten"></td>
                </tr>
                <tr>
                    <td>Provinsi</td>
                    <td>:</td>
                    <td><input type="text" name="provinsi"></td>
                </tr>
                <tr>
                    <td>Kode Pos</td>
                    <td>:</td>
                    <td><input type="text" name="kode_pos"></td>
                </tr>
            </table>
        </div>

        <!-- <h3>Lain Lainnya</h3> -->
        <div>
            <table>
                <tr>
                    <td>Bahasa Pemrograman</td>
                    <td>:</td>
                    <td>
                        <input type="checkbox" name="bahasa" value="C/C++"> C / C++ 
                        <input type="checkbox" name="bahasa" value="Go Lang"> Go Lang 
                        <input type="checkbox" name="bahasa" value="Python"> Python 
                        <input type="checkbox" name="bahasa" value="Lainnya"> Lainnya <br>
                        <input type="checkbox" name="bahasa" value="PHP"> PHP 
                        <input type="checkbox" name="bahasa" value="Javascript"> Javascript 
                        <input type="checkbox" name="bahasa" value="Ruby"> Ruby
                    </td>
                </tr>
                <tr>
                    <td>Kegiatan</td>
                    <td>:</td>
                    <td>
                        <input type="checkbox" name="kegiatan" value="Organisasi Kemahasiswaan"> Organisasi Kemahasiswaan 
                        <input type="checkbox" name="kegiatan" value="Bidang Olahraga"> Bidang Olahraga 
                        <input type="checkbox" name="kegiatan" value="Lainnya"> Lainnya <br>
                        <input type="checkbox" name="kegiatan" value="Organisasi di Luar Kampus"> Organisasi di Luar Kampus 
                        <input type="checkbox" name="kegiatan" value="Bidang Seni"> Bidang Seni
                    </td>
                </tr>
            </table>
        </div>

        <input type="reset" name="cancel">
        <input type="submit">
    </form>
</body>
</html>
